<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hilde Windels, visual artist</title>
  <meta name="description" content="The work of Hilde Windels through the years, 1990 to 2026. Visual artist working in flax." />
  <link rel="canonical" href="https://hilde-windels.com/" />

  <!-- Hoe de link eruitziet als hij gedeeld wordt in WhatsApp, mail of sociale media -->
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="en_GB" />
  <meta property="og:site_name" content="Hilde Windels" />
  <meta property="og:url" content="https://hilde-windels.com/" />
  <meta property="og:title" content="Hilde Windels, visual artist" />
  <meta property="og:description" content="The work of Hilde Windels through the years, 1990 to 2026. Visual artist working in flax." />
  <meta property="og:image" content="https://hilde-windels.com/assets/preview.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Detail of a flax work by Hilde Windels" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400;500&display=swap" rel="stylesheet" />
  <link rel="icon" href="favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  {{GESTRUCTUREERDE_DATA}}

  <link rel="stylesheet" href="styles.css?v=14" />
</head>
<body class="page page--timeline">

  <header class="bar">
    <p class="bar__role">Visual artist</p>
    <button class="burger" id="burger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="menu">
      <span></span><span></span>
    </button>
    <nav class="bar__nav" id="menu" aria-label="Main navigation">
      <a href="index.html" class="is-current" aria-current="page">Work</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="stage">
    <div class="stage__side">
      <h1 class="display">Hilde<br />Windels</h1>
      <p class="display__sub">Scroll through the timeline, from today back to {{OUDSTE}}</p>
      <div class="focus" id="focus">
        <div class="focus__vak">
          <span class="focus__live" aria-live="polite">{{EERSTE_DETAIL}}</span>
          <div class="bladeren">
            <button class="pijl pijl--vorige" id="tl-vorige" type="button" aria-label="Previous works" disabled></button>
            <button class="pijl pijl--volgende" id="tl-volgende" type="button" aria-label="Next works"></button>
          </div>
        </div>
      </div>
    </div>

    <div class="timeline">
      <ol class="tl__list" id="tl">
{{WERKEN}}
      </ol>
    </div>
  </main>

  <div class="kijker" id="kijker" hidden>
    <button class="kijker__sluit" id="kijker-sluit" type="button" aria-label="Close"></button>
    <button class="pijl pijl--vorige kijker__pijl kijker__pijl--vorige" id="kijker-vorige" type="button" aria-label="Previous photo"></button>
    <figure class="kijker__fig">
      <img id="kijker-img" alt="" />
      <figcaption class="kijker__cap">
        <span class="kijker__kop"><span class="kijker__titel" id="kijker-titel"></span><span class="kijker__jaar" id="kijker-jaar"></span></span>
        <span class="kijker__detail" id="kijker-detail"></span>
        <span class="kijker__teller" id="kijker-teller"></span>
      </figcaption>
    </figure>
    <button class="pijl pijl--volgende kijker__pijl kijker__pijl--volgende" id="kijker-volgende" type="button" aria-label="Next photo"></button>
  </div>


  <script src="script.js?v=14"></script>
</body>
</html>
