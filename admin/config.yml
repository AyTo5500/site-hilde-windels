# Instellingen voor Sveltia CMS.
backend:
  name: github
  repo: AyTo5500/site-hilde-windels
  branch: main

media_folder: assets/works
public_folder: /assets/works   # schuine streep vooraan, anders zoekt het CMS onder /admin/

locale: nl

collections:
  - name: werken
    label: Werken
    label_singular: Werk
    folder: werken
    extension: json
    create: true
    delete: true
    slug: '{{fields.fotos.0 | default("werk")}}'
    identifier_field: titel
    summary: '{{titel}} ({{jaar}})'
    sortable_fields: [jaar, titel]
    view_filters: []
    fields:
      - { name: titel, label: Titel, widget: string }
      - name: titel_nl
        label: Titel in het Nederlands
        widget: string
        required: false
        hint: 'Alleen invullen als de titel in het Nederlands anders is, bijvoorbeeld: Zonder titel. Anders leeg laten.'
      - { name: jaar, label: Jaartal, widget: number, value_type: int, min: 1980, max: 2100 }
      - name: materiaal
        label: Materiaal (Engels)
        widget: text
        hint: 'Bijvoorbeeld: Flax strips, partly painted. Suspended from a metal rod'
      - name: materiaal_nl
        label: Materiaal (Nederlands)
        widget: text
        hint: 'Bijvoorbeeld: Vlasstroken, deels beschilderd. Hangend aan metalen staaf'
      - name: afmetingen
        label: Afmetingen
        widget: string
        hint: 'In het Engels, B wordt W (width). Bijvoorbeeld: H 152 · W 94 · D 5 cm. De Nederlandse versie maakt de site zelf.'
      - name: collectie
        label: Collectie
        widget: string
        required: false
        hint: 'Alleen invullen als het werk in een collectie zit, in het Engels. Bijvoorbeeld: Collection Huis Perrekes, Oosterlo. De Nederlandse versie maakt de site zelf.'
      - name: fotograaf
        label: Fotograaf
        widget: string
        required: false
        hint: 'Alleen de naam, bijvoorbeeld: Jeroen Windels. Op de site komt er "Photo" voor.'
      - name: volgorde
        label: Volgorde binnen het jaar
        widget: number
        value_type: int
        required: false
        hint: 'Alleen van belang bij meerdere werken uit hetzelfde jaar. Een lager getal komt eerst.'
      - name: fotos
        label: Foto's
        label_singular: Foto
        widget: list
        collapsed: false
        field: { name: foto, label: Foto, widget: image }
        hint: 'De eerste foto is de foto die in de tijdsbalk staat. Versleep om de volgorde te wijzigen.'
