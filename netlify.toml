# Netlify bouwt de site met dit bestand.
# build.py zet de bestanden uit werken/ om naar index.html.

[build]
  command = "python3 build.py"
  publish = "."

[build.environment]
  PYTHON_VERSION = "3.11"

# Het oude netlify.app-adres doorsturen naar het echte domein, zodat er maar
# een vindbare versie van de site bestaat en oude links blijven werken.
[[redirects]]
  from = "https://keen-belekoy-910ed7.netlify.app/*"
  to = "https://hilde-windels.com/:splat"
  status = 301
  force = true

# ======================================================================
# TIJDELIJK: de site is nog niet af, dus zoekmachines blijven weg.
# Verwijder dit hele blok zodra de werken en teksten kloppen, push, en
# dan mag Google hem indexeren. Dit is het enige dat daarvoor hoeft.
# ======================================================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# sitemap.xml wordt bij elke bouw opnieuw gemaakt, dus niet lang laten cachen.
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
